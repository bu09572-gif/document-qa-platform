name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q

  real-data-eval:
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Cache downloaded filings (bronze layer)
        uses: actions/cache@v4
        with:
          path: data/bronze
          key: bronze-financebench-v1
      - name: Pipeline on real FinanceBench filings
        run: python -m docpipe.run --scope eval
      - name: Retrieval evaluation (BM25 settings, all 150 questions)
        run: python -m evalkit.run --dataset financebench
      - name: Regression gate vs committed baseline
        run: python -m evalkit.gate --dataset financebench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/
            data/reports/

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docqa:ci .
      - name: Start the API container (downloads and indexes the filings on first start)
        run: |
          docker run -d --name api -p 8000:8000 -e DOCQA_RETRIEVAL=+filing_routing_v2 docqa:ci
          for i in $(seq 90); do curl -sf localhost:8000/health && break; sleep 5; done
      - name: Smoke test
        run: |
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"question": "What is the FY2018 capital expenditure amount for 3M?", "k": 3}' | tee /tmp/r.json
          grep -q 3M_2018_10K /tmp/r.json
          curl -sf localhost:8000/metrics | grep -q docqa_retrieval_seconds_count
      - run: docker logs api | tail -30
        if: always()
