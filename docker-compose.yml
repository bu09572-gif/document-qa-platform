# docker compose up --build    API at http://localhost:8000/docs, metrics at /metrics
services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes: ["ollama:/root/.ollama"]
  pull-model:
    image: ollama/ollama:0.12.6
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
  api:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: qwen2.5:3b
      DOCQA_RETRIEVAL: "+hybrid_bm25_dense"
    volumes: ["filings:/app/data", "models:/app/models"]
    ports: ["8000:8000"]
volumes:
  ollama: {}
  filings: {}
  models: {}
