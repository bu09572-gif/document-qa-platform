[project]
name = "ai-ml-portfolio"
version = "0.1.0"
description = "Shared foundations (data pipeline, document Q&A, evaluation platform) for a portfolio of applied AI projects"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pyarrow>=15",
  "pypdfium2>=4.30", "requests>=2.31", "fsspec>=2024.2",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
aws = ["s3fs>=2024.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
